# sofa-fand - curves, limits, profiles. Read once at daemon start (sudo make install reloads).
# DRAFT 2026-11-17 evening - to be tuned from the overnight measurements (README).
#
# sensor KEY trip T warn W [ff cpu|gpu|both|none]
#   trip: all fans to max for trip_hold s (temperature) - an unreadable sensor hands the fans to
#   the SMC instead. warn: level 2 for Sofa, starts a stopped fan regardless of minoff.
#   ff: the sensor reads hotter by load (feed-forward). KEY HDD = SMART attribute 194.
# fan N name X max R minrun R hyst C up R/s down R/s minon S minoff S
# curve N KEY T:RPM ...  linear between points; the fan runs the highest demand of its curves
# floor N KEY T RPM      fan N at least RPM while KEY >= T (Apple-minimum guarantee)
# profile NAME SHIFT [VOLSHIFT]  curves read SHIFT (+ VOLSHIFT*volume) C cooler: + quieter, - cooler
#
# Apple's own SMC thresholds (read from the SMC, fan start F / warning W / throttle P / shutdown S):
#   Tp2H 96/98/103/108, Tp1P + Tp3H 79/84/89, TL0P 58.4/60.4/66/68, TS0P 50/52,
#   targets: GPU SGTg 77, CPU SCTg 70, ODD SOTg 55. Below them Apple runs every fan at its minimum.

sensor TG0D trip 80 warn 72 ff gpu    # GPU die (Apple target 77)
sensor TC0P trip 72 warn 65 ff cpu    # CPU proximity (i5-2500S Tcase 69.1, Apple target 70)
sensor TCXc trip 92 warn 85 ff cpu    # CPU PECI, hottest core
# redundancy against a frozen low reading (review N6): every control sensor has a second one
sensor TG0H trip 82 warn 74 ff gpu    # GPU heatsink (backs up TG0D)
sensor TC0c trip 95 warn 88 ff cpu    # core 0..3 (back up TC0P/TCXc)
sensor TC1c trip 95 warn 88 ff cpu
sensor TC2c trip 95 warn 88 ff cpu
sensor TC3c trip 95 warn 88 ff cpu
sensor TO0P trip 58 warn 52           # optical drive (Apple target 55)
sensor Tp2H trip 92 warn 85 ff both   # power supply heatsink (Apple fan start 96)
sensor Tp1P trip 82 warn 76           # power supply proximity (Apple 79)
sensor TL0P trip 58 warn 54           # LCD (Apple fan start 58.4)
sensor TA0P trip 40 warn 33           # ambient
sensor HDD  trip 53 warn 49           # WD Red WD20EFAX (spec 65)

# F0 ODD: cools the GPU (and the LCD/ODD area). Apple min 1150, max 2500. Stable from 500.
fan 0 name ODD max 2500 minrun 500 hyst 3 up 150 down 15 minon 120 minoff 120
curve 0 TG0D 54:0 58:600 64:1150 70:1800 74:2500
curve 0 TO0P 46:0 50:800 54:1600 57:2500
curve 0 TL0P 49:0 53:1150 57:2500
curve 0 TG0H 52:0 56:600 62:1150 68:1800 72:2500
floor 0 TG0D 67 1150
floor 0 TL0P 50 1150
# F1 HDD: loudest fan; turns only on (~1280 at its lowest duty) or off. Long on/off phases.
fan 1 name HDD max 5500 minrun 1100 hyst 2.5 up 200 down 10 minon 900 minoff 900 profile_weight 0 ff_weight 0
curve 1 HDD  48.5:0 49:1100 52:2200 54:3500
curve 1 Tp2H 86:0 88:1100 91:2500
floor 1 HDD 50 1100
# F2 CPU: cools the CPU and the power supply heatsink. Apple min 940, max 2100. Stable from 500.
fan 2 name CPU max 2100 minrun 500 hyst 3 up 150 down 15 minon 120 minoff 120
curve 2 TC0P 52:0 55:500 59:940 63:1500 67:2100
curve 2 Tp2H 72:0 76:600 80:1100 84:1700 88:2100
curve 2 TCXc 70:0 75:700 82:1500 88:2100
floor 2 TC0P 62 940
floor 2 Tp2H 84 940

profile default 0
profile ruhe 2           # quieter
profile idle 1
profile playback -1 -2   # sound masks the fans: run cooler, the louder the more

feedforward 4 3 3000     # +4 C on CPU sensors at full CPU load, +3 C on GPU at full GPU load
hdd_interval 30
hdd_stale 150
trip_hold 300
allow_uid 501
reply_dir /Users/imac/Library/Caches/Sofa/
