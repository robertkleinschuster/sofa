# sofa-fand - curves, limits, profiles. Read once at daemon start (sudo make install reloads).
# Tuned 2026-11-18 from the measurements in docs/fan-tuning.md (effect matrix, H1, Apple reference).
#
# sensor KEY trip T warn W [ff cpu|gpu|both|none] [fast 1]
#   fast 1: read every control step (2-10 s); other sensors every 120 s (each SMC read costs ~25 kernel
#   wakeups). The fast set: GPU die + heatsink, CPU proximity, PECI + core 0 (backups against a frozen reading), PSU heatsink.
#   trip: all fans to max for trip_hold s (temperature); an unreadable sensor hands the fans to
#   the SMC instead. warn: level 2 for Sofa; starts a stopped fan regardless of minoff.
#   ff: the sensor reads hotter by load (feed-forward). KEY HDD = SMART attribute 194.
# fan N name X max R minrun R hyst C up R/s down R/s minon S minoff S [profile_weight W] [ff_weight W]
# curve N KEY T:RPM ...  linear between points; a fan runs the highest demand of all its curves
# floor N KEY T RPM      fan N at least RPM while KEY >= T (Apple-minimum guarantee; holds always)
# profile NAME SHIFT [VOLSHIFT]  curves read SHIFT (+ VOLSHIFT*volume) C cooler: + quieter, - cooler
#
# Coupling (measured, deg C per 100 rpm, see docs/fan-tuning.md):
#   F0 ODD: GPU TG0D -0.19, PCH TPCD -0.21, RAM Tm0P -0.12, LCD TL0P -0.11, Tp1P -0.09; PSU Tp2H 0
#   F1 HDD: drive -0.04, PCH -0.06, TS0P/TS2P -0.07; nothing else -> only the drive steers it
#   F2 CPU: PSU heatsink Tp2H -0.7..-1.4, PECI -0.6, Tp3H -0.4, Tp1P -0.3, CPU -0.13..-1.05, LCD -0.13
# Apple's own thresholds (SMC, fan start F / warning / throttle / shutdown): Tp2H 96/98/103/108,
#   Tp1P + Tp3H 79/-/84/89, TL0P 58.4/60.4/66/68, TS0P 50/52; GPU target 77, CPU 70, ODD 55.
#   Below them Apple runs every fan at its minimum (measured: idle, playback, CPU full load).

sensor TG0D trip 80 warn 72 ff gpu fast 1    # GPU die (Apple target 77)
sensor TG0H trip 82 warn 74 ff gpu fast 1 # GPU heatsink, backs up TG0D
sensor TC0P trip 72 warn 65 ff cpu fast 1    # CPU proximity (i5-2500S Tcase 69.1, Apple target 70)
sensor TCXc trip 92 warn 85 ff cpu fast 1    # CPU PECI, hottest core (Apple 86)
sensor TC0c trip 95 warn 88 ff cpu fast 1 # cores: back up TC0P/TCXc against a frozen reading
sensor TC1c trip 95 warn 88 ff cpu
sensor TC2c trip 95 warn 88 ff cpu
sensor TC3c trip 95 warn 88 ff cpu
sensor TO0P trip 58 warn 52                  # optical drive (Apple target 55)
sensor Tp2H trip 92 warn 85 ff both fast 1   # power-supply heatsink (Apple fan start 96)
sensor Tp1P trip 80 warn 74           # power supply proximity (Apple 79/84)
sensor Tp3H trip 82 warn 76           # power supply 3 heatsink (Apple 79/84)
sensor TPCD trip 78 warn 70           # PCH die
sensor Tm0P trip 76 warn 66           # memory
sensor TL0P trip 58 warn 54                  # LCD (Apple fan start 58.4, the lowest Apple threshold)
sensor TS0P trip 52 warn 48           # Apple SS0F 50 / SS0W 52
sensor TA0P trip 40 warn 33           # ambient: monitored only (its effect shows in every sensor)
sensor HDD  trip 53 warn 49           # WD Red WD20EFAX (spec 65)

# F0 ODD (Apple min 1150, max 2500, stable from 500): GPU, PCH, LCD, ODD area, RAM.
fan 0 name ODD max 2500 minrun 500 hyst 3 up 150 down 15 minon 120 minoff 120
curve 0 TG0D 52:0 56:600 62:1150 68:1800 72:2500
curve 0 TG0H 50:0 54:600 60:1150 66:1800 70:2500
curve 0 TO0P 44:0 48:800 52:1600 55:2500
curve 0 TPCD 62:0 66:900 70:1600 74:2500
curve 0 TL0P 46:0 50:800 54:1600 57:2500
curve 0 Tm0P 56:0 62:1000 68:2000
# drive: heated mostly by the display (~65-70 W on), the quiet ODD fan cools its surroundings;
# reads the profile shift like every ODD curve (playback 43 C -> ~1500 rpm, rest 44 C -> off)
curve 0 HDD  44:0 46:1000 48:1600 50:2500
floor 0 TG0D 67 1150
floor 0 TO0P 50 1150
floor 0 TPCD 68 1150
floor 0 TL0P 52 1150

# F1 HDD (the loud one): turns only on (~1280 at its lowest duty) or off and cools almost only the
# drive (-1.5 C at 4900 rpm). Off up to 46 C, on from 49 C, long phases; ignores profiles and load.
fan 1 name HDD max 5500 minrun 1100 hyst 2.5 up 200 down 10 minon 900 minoff 900 profile_weight 0 ff_weight 0
curve 1 HDD  48.5:0 49:1100 52:2200 54:3500
curve 1 TS0P 48.5:0 49:1100 51:2200
floor 1 HDD 50 1100

# F2 CPU (Apple min 940, max 2100, stable from 500): CPU and the whole power supply. It is the only
# fan that cools Tp2H measurably, so Tp2H drives it: start at 62, 1500 by 70 (at 1500 under 2-core load
# Tp2H settles near 72; at 940 it climbs without end; cooling at all-max is slow, ~3 C/min). The same
# curve keeps the CPU fan running in rest mode once Tp2H passes 62-64 (idle with all fans off: +0.75 C/min).
fan 2 name CPU max 2100 minrun 500 hyst 3 up 150 down 15 minon 120 minoff 120
curve 2 TC0P 50:0 54:500 58:900 63:1500 67:2100
curve 2 TCXc 72:0 78:800 84:1500 88:2100
curve 2 Tp2H 62:0 65:600 70:1500 76:2000 80:2100
curve 2 Tp1P 56:0 62:900 68:1600 74:2100
curve 2 Tp3H 62:0 68:900 74:1600 78:2100
curve 2 Tm0P 54:0 60:900 66:1800
curve 2 TL0P 48:0 52:900 56:2100
floor 2 TC0P 62 940
floor 2 Tp2H 70 940
floor 2 Tp1P 72 940

profile default 0
profile ruhe 2           # quieter
profile idle -2          # in use (screen on): 3 C cooler than before (user 2026-11-18)
profile playback -4 -2   # sound masks the fans: run cooler, the louder the more (2026-11-18: -1 -> -4)

feedforward 4 3 3000     # +4 C on CPU sensors at full CPU load, +3 C on GPU at full GPU load
hdd_interval 30
hdd_stale 150
trip_hold 300
allow_uid 501
reply_dir /Users/imac/Library/Caches/Sofa/
