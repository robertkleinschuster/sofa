# sofa-fand - curves and limits (read once at daemon start; restart to apply:
#   sudo launchctl unload /Library/LaunchDaemons/de.sofa.fand.plist && sudo launchctl load ...)
# Measured 2026-11-17 on the iMac12,2, see README.md.
#
# limit KEY MAX      while in rest mode: KEY >= MAX -> all fans back to the SMC for trip_holdoff s.
#                    An unreadable key trips as well. KEY "HDD" = drive temperature from SMART.
# fan N sensor KEY hyst H [floor RPM] steps T:RPM ...
#                    KEY < T -> RPM (first matching step); above the last T the SMC regulates
#                    this fan as usual. Going down a step needs KEY < T - H (hysteresis).

limit TG0D 75     # GPU die - the fastest riser without airflow (~2 C/min under load)
limit TC0P 65     # CPU proximity (i5-2500S Tcase 69.1)
limit TCXc 85     # CPU PECI (hottest core)
limit TO0P 55     # optical drive
limit Tp2H 90     # power supply heatsink (65-83 measured)
limit HDD  50     # WD Red WD20EFAX (spec 65), already 44-47 under SMC control

# F0 ODD fan: cools the GPU. Apple minimum 1150.
fan 0 sensor TG0D hyst 4 steps 56:0 62:700 66:900
# F1 HDD fan: ignores targets, only runs (~1280) or stops (0). Off at <= 44 C, SMC again at 46 C.
fan 1 sensor HDD  hyst 1.5 steps 46:0
# F2 CPU fan: Apple minimum 940; at 0 rpm under playback load the CPU settled at 58 C.
fan 2 sensor TC0P hyst 3 steps 56:0 60:500 63:700

hdd_interval 30   # s between SMART reads (own thread)
hdd_stale 120     # s; an older drive reading counts as unreadable
trip_holdoff 600  # s in SMC control after a trip
allow_uid 501     # besides root, this uid may switch rest mode (imac)
